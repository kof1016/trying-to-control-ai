name: Spring Boot

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: spring-boot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 25 / Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Temurin 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: examples/spring-boot/pom.xml

      - name: Verify Spring Boot shell
        working-directory: examples/spring-boot
        run: ./mvnw --batch-mode --no-transfer-progress verify
